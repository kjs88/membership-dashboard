<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>프로젝트 관리</title>
<style>
  :root{
    --green:#00A582;--green-dark:#00876B;--green-deep:#006F58;--green-light:#E5F8F4;--green-mid:#A8E6D9;
    --bg:#F4F6F5;--surface:#fff;--surface2:#F9FBFA;--line:#E4EAE7;--line2:#CDD9D4;
    --txt:#1A2820;--muted:#5A706A;--soft:#9AB0AA;--blue:#2B72C8;--violet:#7856C8;
    --warn:#E8900A;--warn-light:#FEF3DC;--danger:#D94040;--danger-light:#FDECEC;
    --shadow:0 1px 3px rgba(0,165,130,.06),0 4px 12px rgba(0,165,130,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:'Noto Sans KR','Segoe UI','Malgun Gothic',sans-serif;color:var(--txt);padding:18px 20px 28px;line-height:1.45}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer;border:0;border-radius:8px;font-weight:800}
  input,select,textarea{border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--txt);font-size:13px;outline:none}
  input,select{height:38px;padding:0 10px}
  textarea{padding:9px 10px;resize:vertical;min-height:78px}
  input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,165,130,.1)}
  .app-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
  .title-row{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  h1{font-size:20px;font-weight:900;letter-spacing:0}
  .badge{font-size:10px;font-weight:900;padding:3px 8px;border-radius:5px;background:var(--green-light);border:1px solid var(--green-mid);color:var(--green-dark)}
  .sub{font-size:12px;color:var(--soft)}
  .head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .btn-primary{height:38px;background:var(--green);color:#fff;padding:0 15px;box-shadow:0 2px 8px rgba(0,165,130,.22)}
  .btn-primary:hover{background:var(--green-dark)}
  .btn-ghost{height:38px;background:#fff;color:var(--muted);padding:0 13px;border:1px solid var(--line2)}
  .btn-ghost:hover{background:var(--green-light);color:var(--green-dark);border-color:var(--green-mid)}
  .btn-danger{height:38px;background:var(--danger-light);color:var(--danger);padding:0 13px;border:1px solid rgba(217,64,64,.35)}
  .btn-danger:hover{background:var(--danger);color:#fff}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  .toolbar input{width:260px}
  .view-tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
  .view-tab{height:30px;background:transparent;color:var(--muted);padding:0 11px;font-size:12px}
  .view-tab.active{background:var(--green-dark);color:#fff}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
  .panel-title{font-size:14px;font-weight:900}
  .panel-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .project-list{padding:8px;max-height:calc(100vh - 210px);overflow:auto}
  .project-item{display:block;width:100%;text-align:left;background:#fff;border:1px solid transparent;border-radius:8px;padding:11px 12px;margin-bottom:6px;color:var(--txt)}
  .project-item:hover{background:var(--surface2);border-color:var(--line)}
  .project-item.active{background:var(--green-light);border-color:var(--green-mid)}
  .project-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .project-meta{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;color:var(--muted)}
  .progress-line{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:9px}
  .progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:6px}
  .workspace{min-width:0}
  .project-hero{background:var(--green-deep);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .hero-title{font-size:20px;font-weight:900;margin-bottom:5px}
  .hero-desc{font-size:12px;color:rgba(255,255,255,.78);max-width:860px}
  .hero-actions{display:flex;gap:8px;flex-shrink:0}
  .hero-actions .btn-ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
  .stats{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin-top:16px}
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:10px}
  .stat b{display:block;font-size:18px;line-height:1.15}
  .stat span{font-size:11px;color:rgba(255,255,255,.75)}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:1080px;background:#fff}
  th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-size:12px;vertical-align:middle}
  th{position:sticky;top:0;background:var(--surface2);z-index:2;color:var(--muted);font-size:11px;font-weight:900}
  td.actions{white-space:nowrap;text-align:right}
  .task-title{font-weight:900;color:var(--txt);cursor:pointer}
  .task-title:hover{color:var(--green-dark)}
  .indent{display:inline-block;width:18px}
  .chip{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;white-space:nowrap}
  .status-todo{background:#EEF2F1;color:#526863}
  .status-progress{background:#E7F1FE;color:#2B72C8}
  .status-review{background:#FFF3DB;color:#BA7100}
  .status-done{background:#E5F8F4;color:#00876B}
  .priority-high{background:var(--danger-light);color:var(--danger)}
  .priority-mid{background:var(--warn-light);color:var(--warn)}
  .priority-low{background:#EFF5F3;color:var(--muted)}
  .tag{background:var(--green-light);color:var(--green-dark);font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;margin-right:4px}
  .avatar{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;vertical-align:middle}
  .mini-btn{height:28px;padding:0 9px;border:1px solid var(--line2);background:#fff;color:var(--muted);font-size:12px}
  .mini-btn:hover{background:var(--green-light);color:var(--green-dark);border-color:var(--green-mid)}
  .board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:10px}
  .board-col{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:360px;overflow:hidden}
  .board-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:12px;font-weight:900}
  .board-body{padding:8px;min-height:320px}
  .task-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.03);cursor:grab}
  .task-card:hover{border-color:var(--green-mid)}
  .task-card.dragging{opacity:.55}
  .task-card-title{font-size:13px;font-weight:900;margin-bottom:7px}
  .task-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
  .drop-on{outline:2px dashed var(--green-mid);outline-offset:-5px}
  .timeline{overflow:auto;background:#fff}
  .timeline-grid{min-width:1180px;display:grid;grid-template-columns:310px 1fr}
  .timeline-left-head,.timeline-months{position:sticky;top:0;background:var(--surface2);z-index:2;border-bottom:1px solid var(--line);height:38px}
  .timeline-left-head{display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--muted);font-weight:900;border-right:1px solid var(--line)}
  .timeline-months{display:grid;grid-template-columns:repeat(12,1fr)}
  .timeline-months div{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:900}
  .timeline-row-name{height:42px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .timeline-row{height:42px;border-bottom:1px solid var(--line);position:relative;background-image:linear-gradient(to right, transparent calc(8.333% - 1px), rgba(228,234,231,.8) calc(8.333% - 1px), rgba(228,234,231,.8) 8.333%, transparent 8.333%)}
  .timeline-bar{position:absolute;top:9px;height:24px;border-radius:6px;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;box-shadow:0 2px 7px rgba(0,95,75,.15)}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cal-head,.cal-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cal-head{height:34px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--muted)}
  .cal-cell{min-height:96px;background:#fff;padding:6px}
  .cal-day{font-size:11px;color:var(--muted);font-weight:900;margin-bottom:5px}
  .cal-day.dim{color:#CBD6D2}
  .cal-task{font-size:10px;font-weight:800;border-radius:5px;padding:3px 5px;margin-bottom:4px;background:var(--green-light);color:var(--green-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drawer-mask{position:fixed;inset:0;background:rgba(26,40,32,.42);display:none;z-index:60}
  .drawer-mask.on{display:block}
  .drawer{position:absolute;top:0;right:0;width:540px;max-width:96vw;height:100%;background:#fff;box-shadow:-18px 0 45px rgba(0,0,0,.16);display:flex;flex-direction:column}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .drawer-title{font-size:18px;font-weight:900;line-height:1.25}
  .drawer-body{padding:16px 20px;overflow:auto;flex:1}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;font-weight:900;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%}
  .wide{grid-column:1/-1}
  .drawer-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .activity{border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto}
  .log{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px}
  .log:last-child{border-bottom:0}
  .log small{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}
  .subtask-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .subtask-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
  .subtask-row:last-child{border-bottom:0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--green-deep);color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 24px rgba(0,95,75,.18);display:none;z-index:80}
  .trash-count{display:inline-flex;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;align-items:center;justify-content:center;margin-left:3px}
  @media (max-width:1050px){
    body{padding:12px}
    .layout{grid-template-columns:1fr}
    .project-list{max-height:none}
    .stats{grid-template-columns:repeat(2,1fr)}
    .board{grid-template-columns:1fr}
    .hero-top{flex-direction:column}
  }
</style>
</head>
<body>
  <div class="app-head">
    <div>
      <div class="title-row">
        <h1>프로젝트 관리</h1>
        <span class="badge">DATABASE</span>
      </div>
      <div class="sub">프로젝트, 태스크, 보드, 타임라인을 한 곳에서 관리합니다.</div>
    </div>
    <div class="head-actions">
      <button class="btn-ghost" onclick="openTrash()">휴지통 <span class="trash-count" id="trashCount">0</span></button>
      <button class="btn-primary" onclick="openProjectDrawer()">+ 프로젝트</button>
      <button class="btn-primary" onclick="openTaskDrawer()">+ 태스크</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="view-tabs" aria-label="보기 방식">
      <button class="view-tab active" data-view="table" onclick="setView('table')">표</button>
      <button class="view-tab" data-view="board" onclick="setView('board')">보드</button>
      <button class="view-tab" data-view="timeline" onclick="setView('timeline')">타임라인</button>
      <button class="view-tab" data-view="calendar" onclick="setView('calendar')">달력</button>
    </div>
    <input id="q" placeholder="태스크, 태그, 담당자 검색" oninput="renderWorkspace()">
    <select id="filterOwner" onchange="renderWorkspace()"><option value="">담당자 전체</option></select>
    <select id="filterStatus" onchange="renderWorkspace()">
      <option value="">상태 전체</option>
      <option value="todo">할 일</option>
      <option value="progress">진행 중</option>
      <option value="review">검토</option>
      <option value="done">완료</option>
    </select>
    <select id="sortBy" onchange="renderWorkspace()">
      <option value="manual">기본순</option>
      <option value="due">마감 임박순</option>
      <option value="priority">우선순위순</option>
      <option value="progress">진행률순</option>
    </select>
  </div>

  <div class="layout">
    <aside class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">프로젝트</div>
          <div class="panel-sub" id="projectCount">0개</div>
        </div>
        <button class="mini-btn" onclick="selectProject('all')">전체</button>
      </div>
      <div class="project-list" id="projectList"></div>
    </aside>
    <main class="workspace">
      <section class="project-hero" id="projectHero"></section>
      <section class="panel" id="viewHost"></section>
    </main>
  </div>

  <div class="drawer-mask" id="projectMask">
    <div class="drawer">
      <div class="drawer-head">
        <div>
          <div class="drawer-title" id="projectDrawerTitle">프로젝트 추가</div>
          <div class="sub">프로젝트 속성을 수정하면 관련 태스크 화면에 바로 반영됩니다.</div>
        </div>
        <button class="mini-btn" onclick="closeProjectDrawer()">닫기</button>
      </div>
      <div class="drawer-body">
        <div class="form-grid">
          <div class="field wide"><label>프로젝트명 *</label><input id="pName"></div>
          <div class="field"><label>담당자</label><select id="pOwner"></select></div>
          <div class="field"><label>상태</label><select id="pStatus"></select></div>
          <div class="field"><label>시작일</label><input type="date" id="pStart"></div>
          <div class="field"><label>마감일</label><input type="date" id="pEnd"></div>
          <div class="field wide"><label>설명</label><textarea id="pDesc" placeholder="프로젝트 목표, 범위, 성공 기준"></textarea></div>
        </div>
      </div>
      <div class="drawer-foot">
        <button class="btn-danger" id="deleteProjectBtn" onclick="deleteCurrentProject()">삭제</button>
        <div>
          <button class="btn-ghost" onclick="closeProjectDrawer()">취소</button>
          <button class="btn-primary" onclick="saveProject()">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div class="drawer-mask" id="taskMask">
    <div class="drawer">
      <div class="drawer-head">
        <div>
          <div class="drawer-title" id="taskDrawerTitle">태스크 추가</div>
          <div class="sub">하위 태스크, 의존성, 진행 기록까지 한 페이지에서 관리합니다.</div>
        </div>
        <button class="mini-btn" onclick="closeTaskDrawer()">닫기</button>
      </div>
      <div class="drawer-body">
        <div class="form-grid">
          <div class="field wide"><label>태스크명 *</label><input id="tName"></div>
          <div class="field"><label>프로젝트</label><select id="tProject"></select></div>
          <div class="field"><label>상태</label><select id="tStatus"></select></div>
          <div class="field"><label>담당자</label><select id="tOwner"></select></div>
          <div class="field"><label>우선순위</label><select id="tPriority"></select></div>
          <div class="field"><label>시작일</label><input type="date" id="tStart"></div>
          <div class="field"><label>마감일</label><input type="date" id="tEnd"></div>
          <div class="field"><label>진행률 (%)</label><input type="number" min="0" max="100" id="tProgress"></div>
          <div class="field"><label>상위 태스크</label><select id="tParent"></select></div>
          <div class="field wide"><label>의존성</label><select id="tDeps" multiple size="4"></select></div>
          <div class="field wide"><label>태그</label><input id="tTags" placeholder="예: 기획, 긴급"></div>
          <div class="field wide"><label>메모</label><textarea id="tNotes" placeholder="요구사항, 결정사항, 참고 링크"></textarea></div>
        </div>
        <div class="field" id="subtaskSection">
          <label>하위 태스크</label>
          <div class="subtask-list" id="subtaskList"></div>
        </div>
        <div class="field">
          <label>진행 기록</label>
          <div class="activity" id="activityList"></div>
        </div>
        <div class="field">
          <label>기록 추가</label>
          <input id="activityInput" placeholder="진행 상황을 입력하고 Enter" onkeydown="if(event.key==='Enter')addActivity()">
        </div>
      </div>
      <div class="drawer-foot">
        <button class="btn-danger" id="deleteTaskBtn" onclick="deleteCurrentTask()">삭제</button>
        <div>
          <button class="btn-ghost" onclick="closeTaskDrawer()">취소</button>
          <button class="btn-primary" onclick="saveTask()">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div class="drawer-mask" id="trashMask">
    <div class="drawer">
      <div class="drawer-head">
        <div>
          <div class="drawer-title">휴지통</div>
          <div class="sub">삭제한 프로젝트와 태스크를 복원할 수 있습니다.</div>
        </div>
        <button class="mini-btn" onclick="closeTrash()">닫기</button>
      </div>
      <div class="drawer-body" id="trashBody"></div>
      <div class="drawer-foot">
        <button class="btn-danger" onclick="emptyTrash()">휴지통 비우기</button>
        <button class="btn-ghost" onclick="closeTrash()">닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const YEAR = 2026;
const MS_DAY = 86400000;
const today = new Date();
const STATUS = {
  todo:{label:'할 일', cls:'status-todo', short:'할 일'},
  progress:{label:'진행 중', cls:'status-progress', short:'진행'},
  review:{label:'검토', cls:'status-review', short:'검토'},
  done:{label:'완료', cls:'status-done', short:'완료'}
};
const PRIORITY = {
  high:{label:'높음', cls:'priority-high', rank:0},
  mid:{label:'보통', cls:'priority-mid', rank:1},
  low:{label:'낮음', cls:'priority-low', rank:2}
};
const STORE = {p:'pt-projects', t:'pt-tasks', tr:'pt-trash', m:'pt-meta'};
const staffPalette = ['#009E6A','#2B72C8','#7856C8','#E8900A','#43A047','#D94040','#607D8B'];
const fallbackStaff = [{id:'admin', name:'Admin', color:'#009E6A'}];
let staff = [];
let projects = [];
let tasks = [];
let trash = [];
let selectedProjectId = 'all';
let activeView = 'table';
let editingProjectId = null;
let editingTaskId = null;
let draggedTaskId = null;

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(prefix){return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);}
function iso(d){return d ? new Date(d).toISOString().slice(0,10) : '';}
function parseTags(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean);}
function fmtDate(v){return v ? v.slice(5).replace('-','/') : '-';}
function clamp(n,min,max){return Math.max(min, Math.min(max, Number(n)||0));}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',1800);}

function readUsers(){
  try{
    const users = JSON.parse(localStorage.getItem('sj-users-v6')||'[]');
    return Array.isArray(users) ? users : [];
  }catch(_){return [];}
}
function buildStaff(){
  const users = readUsers();
  const candidates = users.filter(u => u && u.name && (u.id === 'admin' || (Array.isArray(u.menuAccess) && u.menuAccess.includes('project'))));
  const list = candidates.length ? candidates : fallbackStaff;
  const seen = new Set();
  staff = list.map((u,i)=>({id:u.id||`staff-${i}`, name:String(u.name).trim(), color:u.color||staffPalette[i%staffPalette.length]}))
    .filter(u=>u.name && !seen.has(u.name) && seen.add(u.name));
  if(!staff.length) staff = fallbackStaff.slice();
}
function staffColor(name){
  return (staff.find(u=>u.name===name)||staff[0]||fallbackStaff[0]).color;
}
function firstStaff(){return staff[0]?.name || 'Admin';}
function initial(name){return esc((String(name||'-').trim()[0]||'-').toUpperCase());}
function fillSelect(el, rows, value){
  el.innerHTML = rows.map(r=>`<option value="${esc(r.value)}">${esc(r.label)}</option>`).join('');
  if(value !== undefined) el.value = value;
}
function fillCommonSelects(){
  const ownerRows = staff.map(u=>({value:u.name,label:u.name}));
  ['filterOwner','pOwner','tOwner'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const cur=el.value;
    if(id==='filterOwner') el.innerHTML='<option value="">담당자 전체</option>';
    else el.innerHTML='';
    ownerRows.forEach(r=>el.add(new Option(r.label,r.value)));
    if([...el.options].some(o=>o.value===cur)) el.value=cur;
  });
  fillSelect(document.getElementById('pStatus'), Object.entries(STATUS).map(([value,s])=>({value,label:s.label})));
  fillSelect(document.getElementById('tStatus'), Object.entries(STATUS).map(([value,s])=>({value,label:s.label})));
  fillSelect(document.getElementById('tPriority'), Object.entries(PRIORITY).map(([value,p])=>({value,label:p.label})));
}

function normalizeStatus(v){
  const s=String(v||'').toLowerCase();
  if(['done','complete','완료'].includes(s)) return 'done';
  if(['prog','progress','진행','진행 중'].includes(s)) return 'progress';
  if(['review','검토'].includes(s)) return 'review';
  return 'todo';
}
function normalizePriority(v){
  const s=String(v||'').toLowerCase();
  if(['high','높음','긴급'].includes(s)) return 'high';
  if(['low','낮음'].includes(s)) return 'low';
  return 'mid';
}
function migrateProject(p,i){
  return {
    id:String(p.id ?? uid('p')),
    name:String(p.name || '새 프로젝트'),
    owner:p.fixed ? '-' : (p.owner || firstStaff()),
    status:normalizeStatus(p.status || 'progress'),
    start:p.start || '',
    end:p.end || '',
    desc:p.desc || '',
    fixed:!!p.fixed,
    order:Number.isFinite(+p.order) ? +p.order : i+1
  };
}
function migrateTask(t,i){
  return {
    id:String(t.id ?? uid('t')),
    pid:String(t.pid ?? selectedProjectId ?? 'p-free'),
    name:String(t.name || '새 태스크'),
    owner:t.owner || t.who || firstStaff(),
    status:normalizeStatus(t.status),
    priority:normalizePriority(t.priority),
    start:t.start || '',
    end:t.end || '',
    progress:clamp(t.progress ?? t.prog ?? (normalizeStatus(t.status)==='done'?100:0),0,100),
    tags:Array.isArray(t.tags) ? t.tags : parseTags(t.tags),
    notes:t.notes || t.desc || '',
    parentId:t.parentId ? String(t.parentId) : '',
    deps:Array.isArray(t.deps) ? t.deps.map(String) : [],
    order:Number.isFinite(+t.order) ? +t.order : i+1,
    logs:Array.isArray(t.logs) ? t.logs : []
  };
}
function loadData(){
  buildStaff();
  try{
    const meta=JSON.parse(localStorage.getItem(STORE.m)||'null');
    const rawP=JSON.parse(localStorage.getItem(STORE.p)||'null');
    const rawT=JSON.parse(localStorage.getItem(STORE.t)||'null');
    const rawTr=JSON.parse(localStorage.getItem(STORE.tr)||'[]');
    projects = Array.isArray(rawP) && rawP.length ? rawP.map(migrateProject) : seedProjects();
    tasks = Array.isArray(rawT) && rawT.length ? rawT.map(migrateTask) : seedTasks();
    trash = Array.isArray(rawTr) ? rawTr : [];
    if(!projects.some(p=>p.fixed)) projects.push({id:'p-free', name:'프로젝트 외 task', owner:'-', status:'progress', start:'', end:'', desc:'특정 프로젝트에 속하지 않는 단건 업무', fixed:true, order:99});
    if(!meta || !meta.notionLike) saveData();
  }catch(_){
    projects = seedProjects();
    tasks = seedTasks();
    trash = [];
    saveData();
  }
}
function saveData(){
  localStorage.setItem(STORE.p, JSON.stringify(projects));
  localStorage.setItem(STORE.t, JSON.stringify(tasks));
  localStorage.setItem(STORE.tr, JSON.stringify(trash));
  localStorage.setItem(STORE.m, JSON.stringify({notionLike:true, savedAt:new Date().toISOString()}));
}

function projectTasks(pid){
  return pid==='all' ? tasks.slice() : tasks.filter(t=>t.pid===pid);
}
function calcProject(pid){
  const rows=projectTasks(pid);
  const total=rows.length;
  const done=rows.filter(t=>t.status==='done').length;
  const overdue=rows.filter(t=>t.status!=='done' && t.end && new Date(t.end+'T23:59:59') < today).length;
  const blocked=rows.filter(t=>(t.deps||[]).some(id=>tasks.find(x=>x.id===id && x.status!=='done'))).length;
  const progress=total ? Math.round(rows.reduce((a,t)=>a+(Number(t.progress)||0),0)/total) : 0;
  return {total,done,overdue,blocked,progress};
}
function currentProject(){
  return selectedProjectId==='all' ? null : projects.find(p=>p.id===selectedProjectId);
}
function getFilteredTasks(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const owner=document.getElementById('filterOwner').value;
  const status=document.getElementById('filterStatus').value;
  const sortBy=document.getElementById('sortBy').value;
  let rows=projectTasks(selectedProjectId).filter(t=>{
    if(owner && t.owner!==owner) return false;
    if(status && t.status!==status) return false;
    if(q){
      const hay=[t.name,t.owner,t.notes,(t.tags||[]).join(' '),projectName(t.pid)].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(sortBy==='due') rows.sort((a,b)=>(a.end||'9999-99-99').localeCompare(b.end||'9999-99-99'));
  else if(sortBy==='priority') rows.sort((a,b)=>(PRIORITY[a.priority]?.rank??1)-(PRIORITY[b.priority]?.rank??1));
  else if(sortBy==='progress') rows.sort((a,b)=>(b.progress||0)-(a.progress||0));
  else rows.sort((a,b)=>(a.order||0)-(b.order||0));
  return rows;
}
function projectName(pid){
  return projects.find(p=>p.id===pid)?.name || '프로젝트 없음';
}
function isBlocked(t){
  return (t.deps||[]).some(id=>tasks.find(x=>x.id===id && x.status!=='done'));
}
function statusChip(status){
  const s=STATUS[status]||STATUS.todo;
  return `<span class="chip ${s.cls}">${s.label}</span>`;
}
function priorityChip(priority){
  const p=PRIORITY[priority]||PRIORITY.mid;
  return `<span class="chip ${p.cls}">${p.label}</span>`;
}
function ownerAvatar(owner){
  return `<span class="avatar" style="background:${staffColor(owner)}">${initial(owner)}</span> ${esc(owner||'-')}`;
}
function ownerAvatarIcon(owner){
  return `<span class="avatar" style="background:${staffColor(owner)}">${initial(owner)}</span>`;
}
function depText(t){
  const open=(t.deps||[]).map(id=>tasks.find(x=>x.id===id)).filter(Boolean).filter(x=>x.status!=='done');
  return open.length ? `<span class="chip priority-high">대기 ${open.length}</span>` : '';
}

function render(){
  fillCommonSelects();
  renderProjects();
  renderWorkspace();
}
function renderProjects(){
  const list=document.getElementById('projectList');
  const rows=projects.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  document.getElementById('projectCount').textContent=`${projects.length}개`;
  document.getElementById('trashCount').textContent=trash.length;
  const all=calcProject('all');
  let html=`<button class="project-item ${selectedProjectId==='all'?'active':''}" onclick="selectProject('all')">
    <div class="project-name">전체 태스크</div>
    <div class="project-meta"><span>${all.done}/${all.total} 완료</span><span>${all.progress}%</span></div>
    <div class="progress-line"><i style="width:${all.progress}%"></i></div>
  </button>`;
  html+=rows.map(p=>{
    const pr=calcProject(p.id);
    return `<button class="project-item ${selectedProjectId===p.id?'active':''}" onclick="selectProject('${esc(p.id)}')">
      <div class="project-name">${esc(p.name)}</div>
      <div class="project-meta"><span>${esc(p.owner)}</span><span>${pr.done}/${pr.total}</span><span>${pr.progress}%</span></div>
      <div class="progress-line"><i style="width:${pr.progress}%"></i></div>
    </button>`;
  }).join('');
  list.innerHTML=html;
}

function renderWorkspace(){
  renderHero();
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.toggle('active', b.dataset.view===activeView));
  if(activeView==='board') renderBoard();
  else if(activeView==='timeline') renderTimeline();
  else if(activeView==='calendar') renderCalendar();
  else renderTable();
}
function setView(view){
  activeView=view;
  renderWorkspace();
}
function selectProject(pid){
  selectedProjectId=pid;
  render();
}

function renderTable(){
  const rows=getFilteredTasks();
  const host=document.getElementById('viewHost');
  if(!rows.length){host.innerHTML='<div class="empty">조건에 맞는 태스크가 없습니다.</div>';return;}
  host.innerHTML=`<div class="table-wrap"><table>
    <thead><tr>
      <th>태스크</th><th>프로젝트</th><th>상태</th><th>담당</th><th>우선순위</th><th>기간</th><th>진행률</th><th>태그</th><th></th>
    </tr></thead>
    <tbody>${rows.map(t=>taskRow(t)).join('')}</tbody>
  </table></div>`;
}
function taskRow(t){
  const hasParent=!!t.parentId;
  return `<tr>
    <td><span class="${hasParent?'indent':''}"></span><span class="task-title" onclick="openTaskDrawer('${esc(t.id)}')">${hasParent?'↳ ':''}${esc(t.name)}</span> ${depText(t)}</td>
    <td>${esc(projectName(t.pid))}</td>
    <td><select onchange="quickStatus('${esc(t.id)}',this.value)">${Object.entries(STATUS).map(([k,s])=>`<option value="${k}" ${t.status===k?'selected':''}>${s.label}</option>`).join('')}</select></td>
    <td>${ownerAvatar(t.owner)}</td>
    <td>${priorityChip(t.priority)}</td>
    <td>${fmtDate(t.start)} ~ ${fmtDate(t.end)}</td>
    <td><input type="number" min="0" max="100" value="${Number(t.progress)||0}" style="width:74px" onchange="quickProgress('${esc(t.id)}',this.value)">%</td>
    <td>${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</td>
    <td class="actions"><button class="mini-btn" onclick="openTaskDrawer('${esc(t.id)}')">열기</button></td>
  </tr>`;
}
function renderBoard(){
  const rows=getFilteredTasks();
  const host=document.getElementById('viewHost');
  host.innerHTML=`<div class="board">${Object.entries(STATUS).map(([key,s])=>{
    const col=rows.filter(t=>t.status===key);
    return `<div class="board-col" ondragover="allowDrop(event)" ondragleave="this.classList.remove('drop-on')" ondrop="dropTask(event,'${key}')">
      <div class="board-head"><span>${s.label}</span><span>${col.length}</span></div>
      <div class="board-body">${col.map(boardCard).join('') || '<div class="empty" style="padding:18px 8px">태스크 없음</div>'}</div>
    </div>`;
  }).join('')}</div>`;
}
function boardCard(t){
  return `<div class="task-card" draggable="true" ondragstart="dragTask(event,'${esc(t.id)}')" ondragend="this.classList.remove('dragging')" onclick="openTaskDrawer('${esc(t.id)}')">
    <div class="task-card-title">${esc(t.name)}</div>
    <div>${priorityChip(t.priority)} ${depText(t)}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">${esc(projectName(t.pid))}</div>
    <div class="progress-line"><i style="width:${Number(t.progress)||0}%"></i></div>
    <div class="task-card-foot"><span style="font-size:11px;color:var(--muted)">${fmtDate(t.end)}</span><span>${ownerAvatarIcon(t.owner)}</span></div>
  </div>`;
}
function dragTask(e,id){draggedTaskId=id;e.currentTarget.classList.add('dragging');}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('drop-on');}
function dropTask(e,status){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-on');
  const t=tasks.find(x=>x.id===draggedTaskId);
  if(t){t.status=status;if(status==='done')t.progress=100;saveData();renderWorkspace();toast('상태를 변경했습니다.');}
  draggedTaskId=null;
}
function renderTimeline(){
  const rows=getFilteredTasks();
  const host=document.getElementById('viewHost');
  if(!rows.length){host.innerHTML='<div class="empty">표시할 태스크가 없습니다.</div>';return;}
  const startYear=new Date(`${YEAR}-01-01`);
  const yearDays=(new Date(`${YEAR+1}-01-01`)-startYear)/MS_DAY;
  host.innerHTML=`<div class="timeline"><div class="timeline-grid">
    <div class="timeline-left-head">태스크</div>
    <div class="timeline-months">${Array.from({length:12},(_,i)=>`<div>${i+1}월</div>`).join('')}</div>
    ${rows.map(t=>{
      let bar='<span style="color:var(--soft);font-size:11px">일정 없음</span>';
      if(t.start && t.end){
        const s=Math.max(0,(new Date(t.start)-startYear)/MS_DAY);
        const e=Math.min(yearDays,(new Date(t.end)-startYear)/MS_DAY+1);
        const left=Math.max(0,s/yearDays*100);
        const width=Math.max(2,(e-s)/yearDays*100);
        const color=t.status==='done'?'var(--green)':t.status==='review'?'var(--warn)':t.status==='todo'?'#60756F':staffColor(t.owner);
        bar=`<div class="timeline-bar" style="left:${left}%;width:${width}%;background:${color}">${esc(STATUS[t.status]?.short||'')} · ${Number(t.progress)||0}%</div>`;
      }
      return `<div class="timeline-row-name" onclick="openTaskDrawer('${esc(t.id)}')">${esc(t.name)}</div><div class="timeline-row">${bar}</div>`;
    }).join('')}
  </div></div>`;
}
function renderCalendar(){
  const rows=getFilteredTasks();
  const host=document.getElementById('viewHost');
  const month = new Date().getFullYear() === YEAR ? new Date().getMonth() : 5;
  const first=new Date(YEAR,month,1);
  const firstDow=first.getDay();
  const days=new Date(YEAR,month+1,0).getDate();
  const prevDays=new Date(YEAR,month,0).getDate();
  let cells=[];
  for(let i=0;i<42;i++){
    const day=i-firstDow+1;
    let date='', label='', dim=false;
    if(day<1){label=prevDays+day;dim=true;}
    else if(day>days){label=day-days;dim=true;}
    else{label=day;date=`${YEAR}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}
    const items=date ? rows.filter(t=>t.start===date || t.end===date) : [];
    cells.push(`<div class="cal-cell"><div class="cal-day ${dim?'dim':''}">${label}</div>${items.map(t=>`<div class="cal-task" onclick="openTaskDrawer('${esc(t.id)}')">${esc(t.name)}</div>`).join('')}</div>`);
  }
  host.innerHTML=`<div class="panel-head"><div><div class="panel-title">${month+1}월 일정</div><div class="panel-sub">시작일과 마감일 기준</div></div></div>
    <div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${cells.join('')}</div>`;
}

function openProjectDrawer(id){
  editingProjectId = id || null;
  const p = editingProjectId ? projects.find(x=>x.id===editingProjectId) : null;
  document.getElementById('projectDrawerTitle').textContent = p ? '프로젝트 수정' : '프로젝트 추가';
  document.getElementById('pName').value = p?.name || '';
  document.getElementById('pOwner').value = p?.owner || firstStaff();
  document.getElementById('pStatus').value = p?.status || 'progress';
  document.getElementById('pStart').value = p?.start || '';
  document.getElementById('pEnd').value = p?.end || '';
  document.getElementById('pDesc').value = p?.desc || '';
  document.getElementById('deleteProjectBtn').style.visibility = p && !p.fixed ? 'visible' : 'hidden';
  document.getElementById('projectMask').classList.add('on');
}
function closeProjectDrawer(){document.getElementById('projectMask').classList.remove('on');editingProjectId=null;}
function saveProject(){
  const name=document.getElementById('pName').value.trim();
  if(!name){alert('프로젝트명을 입력하세요.');return;}
  const data={
    name,
    owner:document.getElementById('pOwner').value,
    status:document.getElementById('pStatus').value,
    start:document.getElementById('pStart').value,
    end:document.getElementById('pEnd').value,
    desc:document.getElementById('pDesc').value.trim()
  };
  if(editingProjectId){
    const p=projects.find(x=>x.id===editingProjectId);
    Object.assign(p,data);
  }else{
    projects.push({id:uid('p'),...data,order:projects.length+1});
  }
  saveData();closeProjectDrawer();render();toast('프로젝트를 저장했습니다.');
}
function deleteCurrentProject(){
  const p=projects.find(x=>x.id===editingProjectId);
  if(!p || p.fixed) return;
  if(!confirm('프로젝트와 포함된 태스크를 휴지통으로 이동할까요?')) return;
  const bundled=tasks.filter(t=>t.pid===p.id);
  trash.unshift({type:'project', project:p, tasks:bundled, deletedAt:new Date().toISOString()});
  projects=projects.filter(x=>x.id!==p.id);
  tasks=tasks.filter(t=>t.pid!==p.id);
  selectedProjectId='all';
  saveData();closeProjectDrawer();render();toast('휴지통으로 이동했습니다.');
}

function openTaskDrawer(id){
  editingTaskId = id || null;
  const t = editingTaskId ? tasks.find(x=>x.id===editingTaskId) : null;
  document.getElementById('taskDrawerTitle').textContent = t ? '태스크 수정' : '태스크 추가';
  fillTaskProjectOptions(t?.pid || (selectedProjectId==='all' ? projects.find(p=>!p.fixed)?.id : selectedProjectId));
  fillTaskRelationOptions(t?.id || '', t?.parentId || '', t?.deps || []);
  document.getElementById('tName').value=t?.name||'';
  document.getElementById('tStatus').value=t?.status||'todo';
  document.getElementById('tOwner').value=t?.owner||firstStaff();
  document.getElementById('tPriority').value=t?.priority||'mid';
  document.getElementById('tStart').value=t?.start||'';
  document.getElementById('tEnd').value=t?.end||'';
  document.getElementById('tProgress').value=t?.progress??0;
  document.getElementById('tTags').value=(t?.tags||[]).join(', ');
  document.getElementById('tNotes').value=t?.notes||'';
  document.getElementById('deleteTaskBtn').style.visibility=t?'visible':'hidden';
  renderActivity(t);
  renderSubtasks(t);
  document.getElementById('taskMask').classList.add('on');
}
function closeTaskDrawer(){document.getElementById('taskMask').classList.remove('on');editingTaskId=null;}
function fillTaskProjectOptions(value){
  const el=document.getElementById('tProject');
  el.innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  el.value=value || projects[0]?.id || '';
  el.onchange=()=>fillTaskRelationOptions(editingTaskId||'', document.getElementById('tParent').value, selectedMulti('tDeps'));
}
function fillTaskRelationOptions(currentId,parentId,deps){
  const pid=document.getElementById('tProject').value;
  const candidates=tasks.filter(t=>t.pid===pid && t.id!==currentId);
  const parent=document.getElementById('tParent');
  parent.innerHTML='<option value="">없음</option>'+candidates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  parent.value=parentId || '';
  const dep=document.getElementById('tDeps');
  dep.innerHTML=candidates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  [...dep.options].forEach(o=>o.selected=(deps||[]).includes(o.value));
}
function selectedMulti(id){return [...document.getElementById(id).selectedOptions].map(o=>o.value);}
function renderActivity(t){
  const box=document.getElementById('activityList');
  const logs=t?.logs||[];
  box.innerHTML=logs.length ? logs.slice().reverse().map(l=>`<div class="log"><small>${esc(l.date||l.d||'')} · ${esc(l.owner||l.who||'')}</small>${esc(l.text||l.txt||'')}</div>`).join('') : '<div class="empty" style="padding:18px">기록이 없습니다.</div>';
  document.getElementById('activityInput').value='';
}
function renderSubtasks(t){
  const box=document.getElementById('subtaskList');
  if(!t){box.innerHTML='<div class="subtask-row">저장 후 하위 태스크를 연결할 수 있습니다.</div>';return;}
  const rows=tasks.filter(x=>x.parentId===t.id);
  box.innerHTML=rows.length ? rows.map(st=>`<div class="subtask-row"><span>${statusChip(st.status)}</span><span class="task-title" onclick="openTaskDrawer('${esc(st.id)}')">${esc(st.name)}</span></div>`).join('') : '<div class="subtask-row">하위 태스크가 없습니다.</div>';
}
function saveTask(){
  const name=document.getElementById('tName').value.trim();
  if(!name){alert('태스크명을 입력하세요.');return;}
  const status=document.getElementById('tStatus').value;
  const data={
    pid:document.getElementById('tProject').value,
    name,
    status,
    owner:document.getElementById('tOwner').value,
    priority:document.getElementById('tPriority').value,
    start:document.getElementById('tStart').value,
    end:document.getElementById('tEnd').value,
    progress:status==='done' ? 100 : clamp(document.getElementById('tProgress').value,0,100),
    parentId:document.getElementById('tParent').value,
    deps:selectedMulti('tDeps'),
    tags:parseTags(document.getElementById('tTags').value),
    notes:document.getElementById('tNotes').value.trim()
  };
  if(data.parentId===editingTaskId){alert('자기 자신을 상위 태스크로 지정할 수 없습니다.');return;}
  if(editingTaskId){
    const t=tasks.find(x=>x.id===editingTaskId);
    Object.assign(t,data);
  }else{
    tasks.push({id:uid('t'),...data,order:tasks.length+1,logs:[]});
  }
  saveData();closeTaskDrawer();render();toast('태스크를 저장했습니다.');
}
function deleteCurrentTask(){
  const t=tasks.find(x=>x.id===editingTaskId);
  if(!t) return;
  if(!confirm('태스크를 휴지통으로 이동할까요?')) return;
  trash.unshift({type:'task', task:t, deletedAt:new Date().toISOString()});
  tasks=tasks.filter(x=>x.id!==t.id).map(x=>({
    ...x,
    parentId:x.parentId===t.id?'':x.parentId,
    deps:(x.deps||[]).filter(id=>id!==t.id)
  }));
  saveData();closeTaskDrawer();render();toast('휴지통으로 이동했습니다.');
}
function addActivity(){
  if(!editingTaskId){alert('태스크를 먼저 저장하세요.');return;}
  const txt=document.getElementById('activityInput').value.trim();
  if(!txt) return;
  const t=tasks.find(x=>x.id===editingTaskId);
  if(!t.logs)t.logs=[];
  t.logs.push({date:iso(new Date()),owner:firstStaff(),text:txt});
  saveData();renderActivity(t);renderWorkspace();toast('기록을 추가했습니다.');
}
function quickStatus(id,status){
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.status=status;
  if(status==='done') t.progress=100;
  saveData();renderWorkspace();
}
function quickProgress(id,value){
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.progress=clamp(value,0,100);
  if(t.progress>=100) t.status='done';
  saveData();renderWorkspace();
}

function openTrash(){
  renderTrash();
  document.getElementById('trashMask').classList.add('on');
}
function closeTrash(){document.getElementById('trashMask').classList.remove('on');}
function renderTrash(){
  const box=document.getElementById('trashBody');
  if(!trash.length){box.innerHTML='<div class="empty">휴지통이 비어 있습니다.</div>';return;}
  box.innerHTML=trash.map((item,i)=>{
    const title=item.type==='project' ? item.project?.name : item.task?.name;
    const sub=item.type==='project' ? `태스크 ${(item.tasks||[]).length}개 포함` : projectName(item.task?.pid);
    return `<div class="subtask-row">
      <div style="flex:1"><b>${esc(title)}</b><div class="panel-sub">${esc(sub)} · ${esc((item.deletedAt||'').slice(0,10))}</div></div>
      <button class="mini-btn" onclick="restoreTrash(${i})">복원</button>
      <button class="mini-btn" onclick="purgeTrash(${i})">삭제</button>
    </div>`;
  }).join('');
}
function restoreTrash(i){
  const item=trash[i];
  if(!item) return;
  if(item.type==='project'){
    projects.push(item.project);
    (item.tasks||[]).forEach(t=>tasks.push(t));
  }else if(item.type==='task'){
    tasks.push(item.task);
  }
  trash.splice(i,1);
  saveData();renderTrash();render();toast('복원했습니다.');
}
function purgeTrash(i){
  if(!confirm('영구 삭제할까요?')) return;
  trash.splice(i,1);
  saveData();renderTrash();render();
}
function emptyTrash(){
  if(!trash.length) return;
  if(!confirm('휴지통을 모두 비울까요?')) return;
  trash=[];
  saveData();renderTrash();render();
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    closeProjectDrawer();
    closeTaskDrawer();
    closeTrash();
  }
});

loadData();
render();
</script>
</body>
</html>
