<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 관리</title>
<style>
  :root{
    --green:#00A582; --green-dark:#00876B; --green-deep:#006F58;
    --green-light:#E5F8F4; --green-mid:#A8E6D9; --green-subtle:#F0FBF8;
    --bg:#F4F6F5; --surface:#fff; --surface2:#F9FBFA;
    --line:#E4EAE7; --line2:#CDD9D4;
    --txt:#1A2820; --muted:#5A706A; --soft:#9AB0AA;
    --accent:#00A582; --accent2:#2B72C8;
    --warn:#E8900A; --warn-light:#FEF3DC;
    --done:#00A582; --danger:#D94040; --danger-light:#FDECEC;
    --row:#F0FBF8; --shadow:0 1px 3px rgba(0,165,130,.06),0 4px 12px rgba(0,165,130,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:'Noto Sans KR','Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--txt);padding:14px 20px 24px;line-height:1.5}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  h1{font-size:18px;font-weight:800;color:var(--txt)}
  .proto{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;background:var(--green-light);border:1px solid var(--green-mid);color:var(--green-dark)}
  .sub{color:var(--soft);font-size:12px;margin-bottom:16px}

  .controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  select,input{background:var(--surface);border:1.5px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
  select:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,165,130,.1)}
  button{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-weight:700}
  .btn-primary{background:var(--green);color:#fff;padding:8px 16px;font-size:13px;box-shadow:0 2px 8px rgba(0,165,130,.22)}
  .btn-primary:hover{background:var(--green-dark)}
  .role{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

  .proj{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
  .ptop{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .ptag{font-size:10px;font-weight:800;padding:3px 10px;border-radius:5px;background:var(--green-light);color:var(--green-dark)}
  .ptop h2{font-size:15px;color:var(--txt)}
  .ptop .prog{margin-left:auto;font-size:12px;color:var(--muted)}

  .split{display:grid;grid-template-columns:380px 1fr;overflow-x:auto}
  .tcol{border-right:2px solid var(--line);min-width:380px}
  .gcol{min-width:720px;position:relative}

  .rowh{display:flex;align-items:center;height:38px;padding:0 14px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0;border-bottom:1px solid var(--line);background:var(--surface2)}

  .trow{display:flex;align-items:center;height:48px;padding:0 14px;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
  .trow:hover{background:var(--row)}
  .t-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-name small{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .who{width:26px;height:26px;border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
  .statsel{font-size:11px;padding:4px 6px}
  .del{background:transparent;color:var(--muted);font-size:16px;padding:0 4px}
  .del:hover{color:var(--danger)}

  .ghead{display:grid;grid-template-columns:repeat(12,1fr);height:38px;border-bottom:1px solid var(--line);background:var(--surface2)}
  .ghead div{font-size:10px;color:var(--muted);text-align:center;align-self:center;border-left:1px solid var(--line)}
  .gridbg{position:absolute;top:38px;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(12,1fr);pointer-events:none}
  .gridbg div{border-left:1px solid rgba(228,234,231,.72)}
  .grow{height:48px;border-bottom:1px solid var(--line);position:relative}
  .gbar{position:absolute;height:22px;top:13px;border-radius:5px;display:flex;align-items:center;padding:0 9px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 2px 6px rgba(0,95,75,.16)}
  .nodate{position:absolute;top:14px;left:12px;font-size:10px;color:var(--muted);font-style:italic}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(26,40,32,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;width:420px;max-width:92vw;box-shadow:0 18px 48px rgba(0,95,75,.18)}
  .modal h3{font-size:15px;margin-bottom:16px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .fld input,.fld select{width:100%}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .btn-ghost{background:var(--surface2);color:var(--muted);padding:8px 16px;font-size:13px;border:1px solid var(--line2)}
  .btn-ghost:hover{background:var(--green-light);border-color:var(--green-mid);color:var(--green-dark)}
  .hint{font-size:10px;color:var(--warn);margin-top:4px}
  .dLogs{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
  .logitem{font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
  .logitem:last-child{border-bottom:none}
  .logd{display:block;font-size:10px;color:var(--accent);margin-bottom:2px;font-weight:600}
  .logempty{font-size:12px;color:var(--muted);text-align:center;padding:16px}
  .pbar-wrap{padding:14px 18px;border-bottom:1px solid var(--line)}
  .pbar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}
  .pbar-pct{font-weight:700;font-size:14px}
  .pbar{height:10px;border-radius:6px;background:var(--green-light);overflow:hidden}
  .pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--accent2));transition:width .4s ease}
  .pbar-sub{font-size:11px;color:var(--muted);margin-top:6px}
  .prio{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;flex-shrink:0}
  .p-high{background:var(--danger-light);color:var(--danger)}
  .p-mid{background:var(--warn-light);color:var(--warn)}
  .p-low{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .tag{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--green-light);color:var(--green-dark);margin-left:3px}
  .due-soon{color:var(--danger);font-weight:700}
  .due-over{color:#fff;background:var(--danger);padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700}
  #search{flex:1;max-width:240px}
  .empty-row{padding:24px;text-align:center;color:var(--muted);font-size:13px}
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;position:relative;box-shadow:var(--shadow)}
  .pcard:hover{border-color:var(--green-mid);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,130,103,.1)}
  .pcard h3{font-size:15px;margin-bottom:4px}
  .pcard .owner{font-size:12px;color:var(--muted);margin-bottom:14px}
  .pcard .pc-pct{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  .pcard .pc-pct b{font-size:15px}
  .pcard .pbar{height:8px}
  .pcard .pc-stat{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--muted)}
  .pcard .pc-stat .over{color:var(--danger);font-weight:700}
  .pcard .pdel{position:absolute;top:12px;right:14px;background:transparent;color:var(--muted);font-size:18px}
  .pcard .pdel:hover{color:var(--danger)}
  .drag-handle{position:absolute;top:14px;right:38px;color:var(--muted);font-size:14px;cursor:grab;letter-spacing:0}
  .pcard.dragging{opacity:.4}
  .pcard.drag-over{border-color:var(--accent2);border-style:dashed}
</style>
</head>
<body>
  <div class="top">
    <h1>프로젝트 관리</h1>
    <span class="proto">진행 현황</span>
  </div>
  <div class="sub">프로젝트별 태스크와 일정</div>

  <!-- ===== 프로젝트 목록 화면 ===== -->
  <div id="listView">
    <div class="controls">
      <button class="btn-primary" id="addProjBtn" onclick="openProjModal()">+ 프로젝트 추가</button>
      <input id="psearch" placeholder="🔍 프로젝트 검색" oninput="renderList()">
      <div class="role">
        역할:
        <select id="role" onchange="renderList();render()">
          <option value="manager">운영 담당자 (전체 입력)</option>
        </select>
      </div>
    </div>
    <div id="projGrid" class="proj-grid"></div>
  </div>

  <!-- ===== 프로젝트 상세(태스크) 화면 ===== -->
  <div id="detailView" style="display:none">
    <button class="btn-ghost" style="margin-bottom:14px" onclick="goList()">← 프로젝트 목록</button>
    <div class="controls">
      <button class="btn-primary" id="addTaskBtn" onclick="openModal()">+ 태스크 추가</button>
      <input id="search" placeholder="🔍 태스크·태그 검색" oninput="render()">
      <select id="fWho" onchange="render()"><option value="">담당자 전체</option></select>
      <select id="fStatus" onchange="render()"><option value="">상태 전체</option><option value="todo">할 일</option><option value="prog">진행</option><option value="review">검토</option><option value="done">완료</option></select>
      <select id="sortBy" onchange="render()"><option value="">기본순</option><option value="due">마감 임박순</option><option value="prio">우선순위순</option><option value="prog">진행률순</option></select>
    </div>

    <div class="proj">
      <div class="ptop">
        <span class="ptag">PROJECT</span>
        <h2 id="projTitle">프로젝트</h2>
        <span class="prog" id="progText">진행률 0%</span>
      </div>
      <div class="pbar-wrap">
        <div class="pbar-top"><span>프로젝트 전체 진행률</span><span class="pbar-pct" id="pbarPct">0%</span></div>
        <div class="pbar"><i id="pbarFill" style="width:0%"></i></div>
        <div class="pbar-sub" id="pbarSub"></div>
      </div>
      <div class="split">
        <div class="tcol">
          <div class="rowh"><span style="flex:1">태스크 / 담당</span><span style="width:90px">상태</span><span style="width:24px"></span></div>
          <div id="tableBody"></div>
        </div>
        <div class="gcol">
          <div class="ghead" id="ghead"></div>
          <div class="gridbg" id="gridbg"></div>
          <div id="ganttBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- modal -->
  <div class="mask" id="mask">
    <div class="modal">
      <h3 id="modalTitle">태스크 추가</h3>
      <div class="fld">
        <label>태스크명 *</label>
        <input id="f_name" placeholder="예: ERP 요구사항 정의서">
      </div>
      <div class="frow">
        <div class="fld">
          <label>담당자 *</label>
          <select id="f_who"></select>
        </div>
        <div class="fld">
          <label>상태</label>
          <select id="f_status">
            <option value="todo">할 일</option><option value="prog">진행</option>
            <option value="review">검토</option><option value="done">완료</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fld">
          <label>시작일</label>
          <input type="date" id="f_start">
        </div>
        <div class="fld">
          <label>종료일</label>
          <input type="date" id="f_end">
          <div class="hint">날짜 비우면 표에만 표시(간트 막대 없음)</div>
        </div>
      </div>
      <div class="frow">
        <div class="fld">
          <label>우선순위</label>
          <select id="f_prio"><option value="low">낮음</option><option value="mid" selected>보통</option><option value="high">높음</option></select>
        </div>
        <div class="fld">
          <label>태그 (쉼표 구분)</label>
          <input id="f_tags" placeholder="기획, 긴급">
        </div>
      </div>
      <div class="fld">
        <label>진행률 (%)</label>
        <input type="number" id="f_prog" min="0" max="100" value="0">
      </div>
      <div class="mact">
        <button class="btn-ghost" onclick="closeModal()">취소</button>
        <button class="btn-primary" onclick="saveTask()">저장</button>
      </div>
    </div>
  </div>
  <div class="mask" id="dMask">
    <div class="modal">
      <h3 id="dTitle">태스크</h3>
      <label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">진행 기록 (최신순)</label>
      <div class="dLogs" id="dLogs"></div>
      <div class="fld" style="margin-top:14px">
        <label>진행상황 추가</label>
        <input id="dInput" placeholder="예: 현업 검토 반영 완료" onkeydown="if(event.key==='Enter')addLog()">
      </div>
      <div class="mact">
        <button class="btn-ghost" onclick="closeDetail()">닫기</button>
        <button class="btn-primary" onclick="addLog()">기록 추가</button>
      </div>
    </div>
  </div>

  <!-- 프로젝트 추가 모달 -->
  <div class="mask" id="pMask">
    <div class="modal">
      <h3>프로젝트 추가</h3>
      <div class="fld"><label>프로젝트명 *</label><input id="p_name" placeholder="예: 신규 거래처 온보딩"></div>
      <div class="fld"><label>담당</label>
        <select id="p_owner"></select>
      </div>
      <div class="fld"><label>설명</label><input id="p_desc" placeholder="간단한 설명 (선택)"></div>
      <div class="mact">
        <button class="btn-ghost" onclick="closeProjModal()">취소</button>
        <button class="btn-primary" onclick="saveProj()">저장</button>
      </div>
    </div>
  </div>

<script>
// ---- 타임라인 범위: 2026 연간 12개월 (월 단위) ----
const YEAR = 2026;
const MONTHS = 12;
const T0 = new Date(YEAR+'-01-01');
const DAYS = Math.round((new Date((YEAR+1)+'-01-01') - T0)/(1000*60*60*24)); // 365
const PROJECT_STAFF_FALLBACK = [{ id:'admin', name:'관리자', role:'admin', color:'#009E6A' }];
const PROJECT_LEGACY_ASSIGNEES = ['김운영','이정합','박설계','영업A'];
const PROJECT_STAFF_PALETTE = ['#009E6A','#2B72C8','#7856C8','#E8900A','#43A047','#D94040'];
let projectStaff = [];
let colors = {};
const statusMap = {todo:'할 일',prog:'진행',review:'검토',done:'완료'};
const prioMap = {high:{t:'높음',c:'p-high'},mid:{t:'보통',c:'p-mid'},low:{t:'낮음',c:'p-low'}};
const prioRank = {high:0,mid:1,low:2};
const TODAY = new Date('2026-06-10'); // 프로토타입 기준 '오늘'
function dueInfo(end,status){
  if(!end||status==='done') return '';
  const diff=Math.round((new Date(end)-TODAY)/(1000*60*60*24));
  if(diff<0) return `<span class="due-over">D+${-diff} 지연</span>`;
  if(diff<=3) return `<span class="due-soon">D-${diff}</span>`;
  return `<span style="color:var(--muted);font-size:11px">~${end.slice(5)}</span>`;
}

function readProjectUsers() {
  try {
    const raw = localStorage.getItem('sj-users-v6');
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

function isProjectStaffRole(role) {
  const value = String(role || '').trim();
  return value && value !== 'user' && value !== 'sales' && value !== '영업사원';
}

function loadProjectStaff() {
  const users = readProjectUsers();
  const seen = new Set();
  const staff = users
    .filter(u => u && u.name && isProjectStaffRole(u.role))
    .map((u, idx) => ({
      id: u.id || `staff-${idx}`,
      name: String(u.name).trim(),
      role: u.role || '',
      color: u.color || PROJECT_STAFF_PALETTE[idx % PROJECT_STAFF_PALETTE.length],
    }))
    .filter(u => {
      if (!u.name || seen.has(u.name)) return false;
      seen.add(u.name);
      return true;
    });
  projectStaff = staff.length ? staff : PROJECT_STAFF_FALLBACK.slice();
  colors = {};
  projectStaff.forEach((u, idx) => {
    colors[u.name] = u.color || PROJECT_STAFF_PALETTE[idx % PROJECT_STAFF_PALETTE.length];
  });
}

function firstProjectStaffName() {
  return projectStaff[0]?.name || PROJECT_STAFF_FALLBACK[0].name;
}

function normalizeProjectAssignee(name, idx = 0) {
  const text = String(name || '').trim();
  if (!text || text === '-') return text;
  if (projectStaff.some(u => u.name === text)) return text;
  const legacyIdx = PROJECT_LEGACY_ASSIGNEES.indexOf(text);
  if (legacyIdx >= 0) return projectStaff[legacyIdx % projectStaff.length]?.name || firstProjectStaffName();
  return projectStaff[idx % projectStaff.length]?.name || firstProjectStaffName();
}

function normalizeProjectAssignments() {
  projects.forEach((p, idx) => {
    if (!p.fixed) p.owner = normalizeProjectAssignee(p.owner, idx);
  });
  tasks.forEach((t, idx) => {
    t.who = normalizeProjectAssignee(t.who, idx);
    if (Array.isArray(t.logs)) {
      t.logs = t.logs.map(log => ({ ...log, who: normalizeProjectAssignee(log.who, idx) }));
    }
  });
}

function fillProjectStaffSelects() {
  const filter = document.getElementById('fWho');
  const taskOwner = document.getElementById('f_who');
  const projectOwner = document.getElementById('p_owner');
  if (filter) {
    const current = filter.value;
    filter.innerHTML = '<option value="">담당자 전체</option>';
    projectStaff.forEach(u => filter.add(new Option(u.name, u.name)));
    filter.value = projectStaff.some(u => u.name === current) ? current : '';
  }
  [taskOwner, projectOwner].forEach(select => {
    if (!select) return;
    const current = select.value;
    select.innerHTML = '';
    projectStaff.forEach(u => select.add(new Option(u.name, u.name)));
    select.value = projectStaff.some(u => u.name === current) ? current : firstProjectStaffName();
  });
}

function initProjectStaff() {
  loadProjectStaff();
  normalizeProjectAssignments();
  fillProjectStaffSelects();
}

// 프로젝트별 태스크 / 진행률 (목록·상세 공통 기준)
function tasksOf(pid){ return tasks.filter(t=>t.pid===pid); }
function projProgress(pid){
  const ts=tasksOf(pid);
  if(!ts.length) return {avg:0,done:0,total:0,over:0};
  const avg=Math.round(ts.reduce((a,t)=>a+(+t.prog||0),0)/ts.length);
  const done=ts.filter(t=>t.status==='done').length;
  const over=ts.filter(t=>t.end&&t.status!=='done'&&new Date(t.end)<TODAY).length;
  return {avg,done,total:ts.length,over};
}

// ===== 목록 화면 =====
let dragPid = null;
function dropOn(targetPid){
  if(dragPid===null || dragPid===targetPid) return;
  const fixed = projects.filter(p=>p.fixed);
  let movable = projects.filter(p=>!p.fixed);
  const from = movable.findIndex(p=>p.id===dragPid);
  const to = movable.findIndex(p=>p.id===targetPid);
  if(from<0||to<0) return;
  const [moved] = movable.splice(from,1);
  movable.splice(to,0,moved);
  projects = [...movable, ...fixed]; // 고정 항목은 항상 뒤
  dragPid = null;
  renderList();
}

function renderList(){
  const role=document.getElementById('role').value;
  document.getElementById('addProjBtn').style.opacity=role==='sales'?.4:1;
  document.getElementById('addProjBtn').style.pointerEvents=role==='sales'?'none':'auto';
  const q=(document.getElementById('psearch').value||'').toLowerCase().trim();
  const dragOff = !!q; // 검색 중엔 드래그 비활성 (순서 꼬임 방지)
  const grid=document.getElementById('projGrid'); grid.innerHTML='';
  const list=projects.filter(p=>!q||p.name.toLowerCase().includes(q));
  list.sort((a,b)=>(a.fixed?1:0)-(b.fixed?1:0)); // 고정 항목 맨 뒤
  if(!list.length){ grid.innerHTML='<div class="empty-row">프로젝트가 없습니다</div>'; return; }
  list.forEach(p=>{
    const pr=projProgress(p.id);
    const card=document.createElement('div'); card.className='pcard';
    const delBtn=(role==='manager'&&!p.fixed)?`<button class="pdel" onclick="event.stopPropagation();delProj(${p.id})">×</button>`:'';
    const overHtml=pr.over?`<span class="over">⚠ 지연 ${pr.over}</span>`:'';
    const handle=(!p.fixed&&!dragOff)?'<span class="drag-handle" title="드래그로 순서 변경">⠿</span>':'';
    card.innerHTML=`${delBtn}${handle}
      <h3>${p.name}</h3>
      <div class="owner">${p.fixed?'📌 '+p.desc:'담당 '+p.owner+(p.desc?' · '+p.desc:'')}</div>
      <div class="pc-pct"><span>진행률</span><b>${pr.avg}%</b></div>
      <div class="pbar"><i style="width:${pr.avg}%"></i></div>
      <div class="pc-stat"><span>태스크 ${pr.done}/${pr.total} 완료</span>${overHtml}</div>`;
    card.onclick=()=>openProject(p.id);
    if(!p.fixed && !dragOff){
      card.draggable=true;
      card.addEventListener('dragstart',()=>{dragPid=p.id;card.classList.add('dragging');});
      card.addEventListener('dragend',()=>{card.classList.remove('dragging');});
      card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drag-over');});
      card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
      card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');dropOn(p.id);});
    }
    grid.appendChild(card);
  });
}

function dayOffset(d){ return Math.round((new Date(d)-T0)/(1000*60*60*24)); }

function buildHeader(){
  const gh = document.getElementById('ghead'), bg = document.getElementById('gridbg');
  gh.innerHTML=''; bg.innerHTML='';
  for(let i=0;i<MONTHS;i++){
    const div=document.createElement('div');
    div.textContent=(i+1)+'월';
    gh.appendChild(div);
    bg.appendChild(document.createElement('div'));
  }
}

function render(){
  const role = document.getElementById('role').value;
  const tb = document.getElementById('tableBody'), gb = document.getElementById('ganttBody');
  tb.innerHTML=''; gb.innerHTML='';

  // ---- 필터 ----
  const q = (document.getElementById('search').value||'').toLowerCase().trim();
  const fWho = document.getElementById('fWho').value;
  const fStatus = document.getElementById('fStatus').value;
  const sortBy = document.getElementById('sortBy').value;

  let view = tasks.filter(t=>{
    if(t.pid!==currentPid) return false;
    if(fWho && t.who!==fWho) return false;
    if(fStatus && t.status!==fStatus) return false;
    if(q){
      const hay=(t.name+' '+(t.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  // ---- 정렬 ----
  if(sortBy==='due') view.sort((a,b)=>(a.end||'9999').localeCompare(b.end||'9999'));
  else if(sortBy==='prio') view.sort((a,b)=>(prioRank[a.priority]??1)-(prioRank[b.priority]??1));
  else if(sortBy==='prog') view.sort((a,b)=>(b.prog||0)-(a.prog||0));

  if(view.length===0){
    tb.innerHTML='<div class="empty-row">조건에 맞는 태스크가 없습니다</div>';
    gb.innerHTML='<div class="empty-row">&nbsp;</div>';
  }

  view.forEach(t=>{
    // table row
    const row=document.createElement('div'); row.className='trow';
    const c = colors[t.who]||'#8b93a4';
    const dep = t.dep?`<small>↳ ${t.dep}</small>`:'';
    const statusCtrl = `<select class="statsel" onchange="setStatus(${t.id},this.value)">`+
      Object.entries(statusMap).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')+`</select>`;
    const delBtn = role==='manager'?`<button class="del" onclick="delTask(${t.id})">×</button>`:`<span style="width:24px"></span>`;
    const p = prioMap[t.priority]||prioMap.mid;
    const prioBadge = `<span class="prio ${p.c}">${p.t}</span>`;
    const tagsHtml = (t.tags||[]).map(tg=>`<span class="tag">${tg}</span>`).join('');
    const cnt = (t.logs&&t.logs.length)?` 💬${t.logs.length}`:'';
    const due = dueInfo(t.end,t.status);

    row.innerHTML = `<div class="who" style="background:${c}">${t.who[0]}</div>
      <span class="t-name"></span>
      ${prioBadge}
      <span style="width:90px">${statusCtrl}</span>${delBtn}`;
    const nm = row.querySelector('.t-name');
    nm.style.cursor='pointer';
    nm.innerHTML = `${t.name}<span style="color:var(--accent);font-size:11px">${cnt}</span>${tagsHtml} ${due}${dep}`;
    nm.onclick=()=>openDetail(t.id);
    tb.appendChild(row);

    // gantt row
    const g=document.createElement('div'); g.className='grow';
    if(t.start && t.end){
      const s=Math.max(0,dayOffset(t.start)), e=Math.min(DAYS,dayOffset(t.end)+1);
      const left=(s/DAYS)*100, width=Math.max(2,((e-s)/DAYS)*100);
      const bg = t.status==='done'?'var(--done)':(t.status==='todo'?'var(--muted)':c);
      g.innerHTML=`<div class="gbar" style="left:${left}%;width:${width}%;background:${bg}">${t.who[0]} · ${t.prog}%</div>`;
    } else {
      g.innerHTML=`<div class="nodate">— 날짜 미입력</div>`;
    }
    gb.appendChild(g);
  });

  // overall progress (현재 프로젝트 기준, 필터 무관)
  const pr = projProgress(currentPid);
  document.getElementById('progText').textContent='평균 '+pr.avg+'%';
  document.getElementById('pbarPct').textContent=pr.avg+'%';
  document.getElementById('pbarFill').style.width=pr.avg+'%';
  document.getElementById('pbarSub').textContent=`태스크 ${pr.done}/${pr.total} 완료 · 평균 진행률 기준`;

  // 영업사원이면 태스크 "추가" 버튼 비활성
  const ab=document.getElementById('addTaskBtn');
  ab.style.opacity = role==='sales'?.4:1;
  ab.style.pointerEvents = role==='sales'?'none':'auto';
}

function openDetail(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  detailId=id;
  if(!t.logs)t.logs=[];
  document.getElementById('dTitle').textContent=t.name;
  const logHtml=t.logs.length
    ? t.logs.slice().reverse().map(l=>`<div class="logitem"><span class="logd">${l.d} · ${l.who}</span>${l.txt}</div>`).join('')
    : '<div class="logempty">아직 진행 기록이 없습니다</div>';
  document.getElementById('dLogs').innerHTML=logHtml;
  document.getElementById('dInput').value='';
  document.getElementById('dMask').classList.add('on');
}
function closeDetail(){ document.getElementById('dMask').classList.remove('on'); }
function addLog(){
  const t=tasks.find(x=>x.id===detailId); if(!t)return;
  const txt=document.getElementById('dInput').value.trim();
  if(!txt){alert('진행 내용을 입력하세요');return;}
  const who=firstProjectStaffName();
  const d=new Date().toISOString().slice(0,10);
  if(!t.logs)t.logs=[];
  t.logs.push({d,who,txt});
  openDetail(detailId);
  render();
}
