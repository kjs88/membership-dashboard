name: Netlify 환경변수 설정

on:
  workflow_dispatch:

concurrency:
  group: netlify-env-update
  cancel-in-progress: false

jobs:
  set-env:
    name: Netlify 환경변수 업데이트
    runs-on: ubuntu-latest

    steps:
      - name: GITHUB_ACTIONS_TOKEN 설정
        run: |
          npx --yes netlify-cli@latest env:set GITHUB_ACTIONS_TOKEN "$DASHBOARD_GITHUB_ACTIONS_TOKEN" --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DASHBOARD_GITHUB_ACTIONS_TOKEN: ${{ secrets.DASHBOARD_GITHUB_ACTIONS_TOKEN }}
