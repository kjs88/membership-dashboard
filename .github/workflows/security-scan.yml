name: 보안 검사

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 보안/코드 건강도 검사
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: 보안 스캔
        shell: pwsh
        run: ./scripts/security-scan.ps1

      - name: 코드 건강도 요약
        shell: pwsh
        run: ./scripts/code-health.ps1
