name: 아마란스 ERP 동기화

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 범위'
        required: false
        default: 'recent60'
        type: choice
        options:
          - recent60
          - full
  schedule:
    # Session starts. GitHub cron starts the runner; scripts/erp_sync_loop.py
    # keeps the precise interval inside the job.
    # KST weekdays 08:00, 14:00, 20:00. UTC 23 previous day, 05, 11.
    - cron: '0 23 * * 0-4'
    - cron: '0 5 * * 1-5'
    - cron: '0 11 * * 1-5'
    # KST weekends 08:00 and 16:00. The loop runs every 2 hours through 24:00.
    - cron: '0 23 * * 5,6'
    - cron: '0 7 * * 6,0'

concurrency:
  group: amarans-erp-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: 주문/출고현황 수집
    runs-on: ubuntu-latest
    timeout-minutes: 520

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl
          python -m playwright install --with-deps chromium

      - name: 아마란스 ERP 수집 및 Firebase 업로드
        run: |
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "utc_now=$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "kst_now=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 23 * * 5,6")
                python scripts/erp_sync_loop.py --interval-minutes 120 --duration-minutes 370 --recent 60 --include-weekend
                ;;
              "0 7 * * 6,0")
                python scripts/erp_sync_loop.py --interval-minutes 120 --duration-minutes 490 --recent 60 --include-weekend
                ;;
              "0 11 * * 1-5")
                python scripts/erp_sync_loop.py --interval-minutes 5 --duration-minutes 250 --recent 60
                ;;
              *)
                python scripts/erp_sync_loop.py --interval-minutes 5 --duration-minutes 360 --recent 60
                ;;
            esac
          elif [ "${{ inputs.mode }}" = "full" ]; then
            python scripts/amarans_api_v10.py --auto --force --full
          else
            python scripts/amarans_api_v10.py --auto --force --recent 60
          fi
        env:
          AMARANS_USERNAME: ${{ secrets.AMARANS_USERNAME }}
          AMARANS_PASSWORD: ${{ secrets.AMARANS_PASSWORD }}
          AMARANS_FIREBASE_DB_URL: ${{ secrets.AMARANS_FIREBASE_DB_URL }}
          AMARANS_FIREBASE_AUTH_TOKEN: ${{ secrets.AMARANS_FIREBASE_AUTH_TOKEN }}
          AMARANS_BROWSER_CHANNEL: ''
          AMARANS_DASHBOARD_DIR: ${{ github.workspace }}
