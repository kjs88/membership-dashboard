name: 아마란스 ERP 동기화

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 범위'
        required: false
        default: 'recent60'
        type: choice
        options:
          - recent60
          - full
  schedule:
    # KST weekdays 08:00-23:55 every 5 minutes (recent).
    # GitHub cron is UTC: KST 08:00-08:55 is UTC 23:00-23:55 on the previous day.
    - cron: '*/5 23 * * 0-4'
    # GitHub cron is UTC: KST 09:00-23:55 is UTC 00:00-14:55 on the same day.
    - cron: '*/5 0-14 * * 1-5'
    # KST weekends 08:00, then every 2 hours through 24:00 (recent).
    - cron: '0 23 * * 5,6'
    - cron: '0 1-13/2 * * 6,0'
    - cron: '0 15 * * 6,0'

concurrency:
  group: amarans-erp-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: 주문/출고현황 수집
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl
          python -m playwright install --with-deps chromium

      - name: 아마란스 ERP 수집 및 Firebase 업로드
        run: |
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "utc_now=$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "kst_now=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 23 * * 5,6"|"0 1-13/2 * * 6,0"|"0 15 * * 6,0")
                AMARANS_IGNORE_AUTO_HOURS=1 AMARANS_IGNORE_AUTO_WEEKEND=1 python scripts/amarans_api_v10.py --auto --recent 60
                ;;
              *)
                AMARANS_IGNORE_AUTO_HOURS=1 python scripts/amarans_api_v10.py --auto --recent 60
                ;;
            esac
          elif [ "${{ inputs.mode }}" = "full" ]; then
            python scripts/amarans_api_v10.py --auto --force --full
          else
            python scripts/amarans_api_v10.py --auto --force --recent 60
          fi
        env:
          AMARANS_USERNAME: ${{ secrets.AMARANS_USERNAME }}
          AMARANS_PASSWORD: ${{ secrets.AMARANS_PASSWORD }}
          AMARANS_FIREBASE_DB_URL: ${{ secrets.AMARANS_FIREBASE_DB_URL }}
          AMARANS_FIREBASE_AUTH_TOKEN: ${{ secrets.AMARANS_FIREBASE_AUTH_TOKEN }}
          AMARANS_BROWSER_CHANNEL: ''
          AMARANS_DASHBOARD_DIR: ${{ github.workspace }}
